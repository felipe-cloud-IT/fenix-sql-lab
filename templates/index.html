<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fénix SQL Lab</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <header class="topbar">
    <div><span class="eyebrow">RUTA PROFESIONAL · SQL</span><h1>Fénix SQL Lab</h1></div>
    <div class="status"><span></span> Laboratorio local</div>
  </header>
  <main class="layout">
    <aside class="sidebar">
      <p class="section-label">Fundamentos</p>
      <button class="lesson" data-lesson="1"><b>01</b><span>SELECT y WHERE<small>Disponible</small></span></button>
      <button class="lesson" data-lesson="2"><b>02</b><span>Ordenar resultados<small>Disponible</small></span></button>
      <button class="lesson locked" disabled><b>03</b><span>Funciones agregadas<small>Bloqueado</small></span></button>
      <div class="progress-box">
        <div><span>Progreso</span><strong id="progressText">0%</strong></div>
        <div class="progress"><div id="progressBar"></div></div>
      </div>
    </aside>
    <section class="content">
      <article class="lesson-card">
        <span class="tag" id="lessonTag"></span>
        <h2 id="lessonTitle"></h2>
        <p id="lessonDescription"></p>
        <div class="concept-grid" id="conceptGrid"></div>
        <div class="challenge"><strong>Desafío</strong><p id="challengeText"></p></div>
      </article>
      <section class="workspace">
        <div class="panel schema-panel">
          <div class="panel-title"><span>Datos disponibles · Tabla: <code id="tableName">equipos</code></span><button id="refreshSchema">Actualizar</button></div>
          <div id="schema" class="schema"></div>
          <div class="table-wrap"><table id="sourceTable"></table></div>
        </div>
        <div class="panel editor-panel">
          <div class="panel-title"><span>Editor SQL</span><span class="safe">Base de datos protegida</span></div>
          <textarea id="sqlEditor" spellcheck="false" aria-label="Editor SQL"></textarea>
          <div class="actions">
            <button id="hintButton" class="secondary">Necesito una pista</button>
            <button id="runButton" class="primary">Ejecutar consulta</button>
          </div>
          <div id="feedback" class="feedback hidden"></div>
        </div>
        <div class="panel result-panel">
          <div class="panel-title"><span>Resultado</span><small id="metrics">Sin ejecutar</small></div>
          <div id="emptyResult" class="empty">Ejecuta tu consulta para ver los resultados.</div>
          <div class="table-wrap"><table id="resultTable"></table></div>
        </div>
      </section>
    </section>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
